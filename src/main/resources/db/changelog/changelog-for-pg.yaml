databaseChangeLog:
  - changeSet:
      id: 1779723114416-5
      author: ivanmalutin
      changes:
        - createTable:
            tableName: license
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_license
              - column:
                  name: end_date
                  type: DATE

  - changeSet:
      id: 1779723114416-1
      author: ivanmalutin
      changes:
        - createTable:
            tableName: author
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_author
              - column:
                  name: license_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_author_license
                    references: license(id)
              - column:
                  name: name
                  type: VARCHAR(255)

  - changeSet:
      id: 1779723114416-2
      author: ivanmalutin
      changes:
        - createTable:
            tableName: book
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_book
              - column:
                  name: author_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_author
                    references: author(id)
              - column:
                  name: title
                  type: VARCHAR(255)

  - changeSet:
      id: 1779723114416-3
      author: ivanmalutin
      changes:
        - createTable:
            tableName: bookstore
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_bookstore
              - column:
                  name: address
                  type: VARCHAR(255)

  - changeSet:
      id: 1779723114416-4
      author: ivanmalutin
      changes:
        - createTable:
            tableName: bookstore_book
            columns:
              - column:
                  name: book_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bookstore_book_book
                    references: book(id)
              - column:
                  name: bookstore_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bookstore_book_store
                    references: bookstore(id)
        - addPrimaryKey:
            tableName: bookstore_book
            columnNames: book_id, bookstore_id
            constraintName: pk_bookstore_book